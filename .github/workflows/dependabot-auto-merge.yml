# Dependabot has no built-in `automerge: true` the way Renovate does. This
# arms auto-merge the same way a human would from the UI, then lets GitHub
# wait for the same checks every other pull request waits for.
#
# pull_request, not pull_request_target: Dependabot's pull requests come from
# a branch on this repo, never a fork, so there's no untrusted checkout to
# guard against. GitHub grants the default GITHUB_TOKEN elevated permissions
# for pull_request events actor'd by dependabot[bot] specifically —
# pull_request_target would trade that away for nothing.
name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ci.yml is the gate; this only arms the merge and lets GitHub wait for
      # that gate itself, rather than polling it from inside the job. Patch
      # and minor only — dependabot.yml already groups those two together for
      # the same reason. A major stays a pull request someone reads, the same
      # as any other breaking change would.
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub's auto-merge lands the commit as GITHUB_TOKEN, and events caused by
  # GITHUB_TOKEN don't trigger workflows, so main got no ci or release run for
  # any Dependabot merge. workflow_dispatch is the one exception to that rule.
  # Dependabot runs can't read the RELEASE_TOKEN Actions secret, so a PAT
  # isn't an option here. Keyed on the PR author, not the actor: the closed
  # event's actor is whoever merged it, which is github-actions.
  run-main-checks:
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch ci and release on main
        run: |
          gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"
          gh workflow run release.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
