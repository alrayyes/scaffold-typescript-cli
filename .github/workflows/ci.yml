# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: biome check
        run: bun run lint
      - name: sort-package-json --check
        run: bun run sort-package-json:check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun test
        # --reporter=junit is bun's own test runner, native - no separate
        # test framework needed. Codecov's Test Analytics and the published
        # report both read the JUnit file; lcov.info is bun's native coverage
        # format.
        run: |
          mkdir -p junit
          bun test --coverage --coverage-reporter=lcov \
            --reporter=junit --reporter-outfile=junit/unit.xml
      - name: coverage as Cobertura XML and an HTML view
        # Runs on pull requests too, so a broken step fails before a merge,
        # not on the default branch.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov
          # Pinned here; no bot reads a pipx pin, so bump it by hand.
          pipx run --spec lcov_cobertura==2.1.1 lcov_cobertura \
            coverage/lcov.info --output coverage/coverage.xml
          genhtml coverage/lcov.info --output-directory coverage/html
      - name: assemble the test and coverage reports
        run: bun scripts/assemble-reports.ts site-reports "${{ github.event.repository.name }}"
      - name: keep the reports for the deploy
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: site-reports/
          if-no-files-found: error
          retention-days: 1
      # GitHub never passes Actions secrets to a Dependabot-triggered run
      # (only Dependabot's own separate secrets store), so CODECOV_TOKEN is
      # always empty here - and Codecov refuses a protected-branch upload
      # without one. Skipping these two steps for that actor is the same
      # shape dependabot-auto-merge.yml's own `if` already uses; nothing
      # else about the job (the tests themselves) skips.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
      # Run even when tests fail - a red PR is exactly the case Test
      # Analytics exists to explain, and a job that stops at the first
      # failing test never reaches an upload step gated behind success.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit/unit.xml
          fail_ci_if_error: true

  # Layout and structure. Style and mechanics are prose.yml.
  prose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # The pinned digest matches the one lefthook.yml's pre-commit hook runs, so
  # the two cannot disagree about the version.
  dockerfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        run: >-
          docker run --rm -i
          -v ${{ github.workspace }}/.hadolint.yaml:/.hadolint.yaml
          hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          < Dockerfile

  # Proves the image still builds before anyone merges, without publishing
  # anything — ubuntu-24.04 ships Docker directly, unlike Forgejo's
  # docker-in-docker runner, so there's no daemon-discovery step needed here.
  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t scaffold-typescript-cli:ci-check .

  # A hook is something you can skip, and the version number depends on
  # these messages being right, so the whole branch is checked here too.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # Publishes the reports to GitHub Pages: <owner>.github.io/<repo>/reports/,
  # or apis.ryankes.eu/<repo>/reports/ for a repo under that domain. A repo has
  # one Pages deployment, so this is the only job that deploys; add docs to the
  # same site/ directory rather than a second workflow, which would replace
  # these reports.
  #
  # The URL carries the repository name Pages gives it, so nothing here names
  # this repo. A user-site repo (<owner>.github.io) would be served at /reports/
  # with no prefix, but that is never a CLI, and the smoke check below reads
  # the real page_url either way.
  #
  # Needs a one-off setting: Settings, Pages, Source "GitHub Actions". The
  # deploy fails until it is on.
  #
  # Every gate is in `needs`, so a red run ships nothing. A skipped need must
  # not skip this job too, hence always() and the two `contains` checks.
  pages:
    needs: [lint, test, prose, dockerfile, docker-build]
    if: >-
      always() && github.event_name != 'pull_request'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # A newer push must not cancel a deploy that's already publishing, so this
    # job opts out of the workflow's cancel-in-progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports
          path: site/reports
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: check the reports are served
        # The deploy succeeds even when the path is wrong, so fetch the real
        # file. Retries cover the CDN catching up to the new version.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
