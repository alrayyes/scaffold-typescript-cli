# Deliberately ungated: a secret can be committed to any file, so there's no
# diff this is safe to skip for — no `paths:` filter, unlike prose.yml.
name: gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      # Pinned by tag and digest. The image's entrypoint is gitleaks, so the
      # empty --entrypoint gets a shell back for the steps below.
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      options: --entrypoint ""
    steps:
      # The image has no node, which the checkout action runs on.
      - name: Install node
        run: apk add --no-cache nodejs
      # fetch-depth: 0, or there's no history to walk and the job passes
      # having scanned nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scoped to branches and tags rather than every ref: GitHub keeps a
      # permanent refs/pull/<n>/head per pull request, which a rewritten
      # history would still leave pointing at pre-rewrite commits.
      # The full scan is deliberate: this repo is small enough that it costs
      # milliseconds, so no range scan is needed (rules/secrets.md).
      - name: Scan the history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks git --redact --no-banner --log-opts="--branches --tags" .
