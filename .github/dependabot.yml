# Runs even though nothing deploys from this repo: a dependency bump that
# needs a config change on our side — a new default, a breaking flag, a
# moved setting — surfaces here, on the template, instead of on day one of
# the first real project cloned from it. Costs nothing to leave on either:
# public repos get unlimited GitHub Actions minutes, so there's no metering
# concern the way a private repo would have.
#
# Dependabot raises the pull request; CI decides whether it lands. Everything
# here is pinned to an exact version, which is the whole reason this works —
# a floating range drifts silently and there's nothing to raise a pull
# request about.
#
# Two pins Dependabot can't see, and which are updated by hand: the base
# image in the Dockerfile (oven/bun) and the hadolint image digest in
# lefthook.yml/ci.yml. Both are digest-pinned and neither lives anywhere
# Dependabot's ecosystems look. The gitleaks image is tracked through the stub
# Dockerfile in .github/gitleaks/, which gitleaks.yml builds.
version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 10
    commit-message:
      # Conventional Commits, because commitlint checks these messages and
      # the version number is computed from them. A `dependencies` bump
      # ships in what this CLI runs, so it's a change to what ships
      # whether or not it's security-relevant, and fix: cuts the patch
      # release the same way any other fix does. A `devDependencies` bump
      # (biome, commitlint, lefthook, markdownlint-cli2, prettier,
      # sort-package-json) never ships, so it stays chore: and releases
      # nothing. github-actions below stays ci: — it changes the
      # pipeline, not the artefact.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      bun-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
      # Grouping (even a group of one) keeps a major bump on Dependabot's
      # lowercase group-title template instead of falling back to its
      # sentence-case single-update one, which fails commitlint's
      # subject-case rule on the raw commit - see rules/releases.md.
      bun-dependencies-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]

  # Ungrouped before, which meant every docker bump - not just a major one
  # - kept Dependabot's sentence-case single-update title and failed
  # commitlint's subject-case rule on the raw commit. Grouped now for the
  # same reason bun/actions are, above.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: fix
      include: scope
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
      docker-major:
        patterns: ["*"]
        update-types: [major]

  # The stub Dockerfile that pins gitleaks for .github/workflows/gitleaks.yml.
  # Dependabot doesn't read a workflow's `container:`, so the pin lives here.
  # ci: because it changes the pipeline, not what ships.
  - package-ecosystem: docker
    directory: /.github/gitleaks
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    commit-message:
      prefix: ci
      include: scope
    # A group, even of one, keeps a bump on Dependabot's lowercase group-title
    # template instead of the sentence-case single-update one, which fails
    # commitlint's subject-case rule (rules/release-bots.md).
    groups:
      gitleaks:
        patterns: ["*"]
        update-types: [minor, patch]
      gitleaks-major:
        patterns: ["*"]
        update-types: [major]
